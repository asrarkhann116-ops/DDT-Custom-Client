<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28" role="img" aria-labelledby="t d">
<title id="t">Divider</title>
<desc id="d">Animated section divider with a travelling light pulse.</desc>
<defs>

<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f81ff" stop-opacity="0"/><stop offset=".25" stop-color="#2f81ff" stop-opacity=".55"/><stop offset=".5" stop-color="#38d5ff" stop-opacity=".9"/><stop offset=".75" stop-color="#2f81ff" stop-opacity=".55"/><stop offset="1" stop-color="#2f81ff" stop-opacity="0"/></linearGradient>
<linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="halo"><stop offset="0" stop-color="#38d5ff" stop-opacity=".55"/><stop offset="1" stop-color="#38d5ff" stop-opacity="0"/></radialGradient>

<style>
text{font-family:Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,'DejaVu Sans Mono',Menlo,monospace}
.fb{transform-box:fill-box;transform-origin:center}
.fl{transform-box:fill-box;transform-origin:left center}

.p{transform:translateX(-300px);animation:run 4.2s cubic-bezier(.45,.05,.35,1) infinite}
.p2{animation-delay:2.1s}
@keyframes run{0%{transform:translateX(-300px);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(1200px);opacity:0}}
.dia{transform-box:fill-box;transform-origin:center;animation:dia 4.2s ease-in-out infinite}
@keyframes dia{0%,100%{transform:rotate(45deg) scale(1)}50%{transform:rotate(225deg) scale(1.25)}}
.halo{animation:halo 4.2s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.4}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.p,.dia,.halo{animation:none!important}.p{display:none}}
</style>
</defs>

<rect x="0" y="13" width="1200" height="2" rx="1" fill="url(#ln)"/>
<rect class="p" x="0" y="12" width="300" height="4" rx="2" fill="url(#pulse)"/>
<rect class="p p2" x="0" y="12" width="300" height="4" rx="2" fill="url(#pulse)" opacity=".7"/>
<circle class="halo" cx="600" cy="14" r="14" fill="url(#halo)"/>
<rect class="dia" x="595" y="9" width="10" height="10" rx="2" fill="#070a10" stroke="#38d5ff" stroke-width="2" transform="rotate(45 600 14)"/>

</svg>
