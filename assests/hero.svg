" r="1.4" fill="#38d5ff" style="animation-duration:12.8s;animation-delay:-10.4s"/><circle class="pt" cx="60" cy="462" r="1.3" fill="#7c5cff" style="animation-duration:9.4s;animation-delay:-11.1s"/><circle class="pt" cx="225" cy="462" r="1.1" fill="#5aa9ff" style="animation-duration:7.9s;animation-delay:-5.7s"/><circle class="pt" cx="693" cy="462" r="2.3" fill="#5aa9ff" style="animation-duration:9.3s;animation-delay:-1.0s"/><circle class="pt" cx="517" cy="462" r="1.0" fill="#5aa9ff" style="animation-duration:9.2s;animation-delay:-8.1s"/><circle class="pt" cx="1010" cy="462" r="2.3" fill="#5aa9ff" style="animation-duration:7.8s;animation-delay:-5.0s"/><circle class="pt" cx="656" cy="462" r="2.5" fill="#5aa9ff" style="animation-duration:11.9s;animation-delay:-3.2s"/><circle class="pt" cx="344" cy="462" r="2.2" fill="#ffffff" style="animation-duration:12.6s;animation-delay:-2.6s"/><circle class="pt" cx="1008" cy="462" r="2.0" fill="#5aa9ff" style="animation-duration:9.5s;animation-delay:-1.3s"/><circle class="pt" cx="1069" cy="462" r="2.5" fill="#38d5ff" style="animation-duration:8.4s;animation-delay:-9.2s"/><circle class="pt" cx="881" cy="462" r="2.3" fill="#5aa9ff" style="animation-duration:10.6s;animation-delay:-3.8s"/><circle class="pt" cx="160" cy="462" r="1.2" fill="#7c5cff" style="animation-duration:9.9s;animation-delay:-8.5s"/><circle class="pt" cx="171" cy="462" r="1.4" fill="#5aa9ff" style="animation-duration:12.5s;animation-delay:-2.7s"/>
