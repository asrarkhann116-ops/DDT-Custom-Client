<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="452" viewBox="0 0 1200 452" role="img" aria-labelledby="t d">
<title id="t">DDT Custom Client</title>
<desc id="d">Animated banner for DDT, the Discord Developer Tool custom client: build, customize, explore.</desc>
<defs>

<clipPath id="frame"><rect width="1200" height="452" rx="18"/></clipPath>
<clipPath id="clipa"><path transform="translate(-83.4,84)" d="M75.5 0C126.6 0 159 -31.5 159 -83.9C159 -136.4 126.6 -168 74.9 -168H10.8V0ZM56.4 -38.8V-129.2H72.4C98.8 -129.2 113.2 -119.1 113.2 -83.9C113.2 -48.8 98.8 -38.8 73.7 -38.8Z"/></clipPath>
<clipPath id="clipb"><path transform="translate(-83.4,84)" d="M75.5 0C126.6 0 159 -31.5 159 -83.9C159 -136.4 126.6 -168 74.9 -168H10.8V0ZM56.4 -38.8V-129.2H72.4C98.8 -129.2 113.2 -119.1 113.2 -83.9C113.2 -48.8 98.8 -38.8 73.7 -38.8Z"/></clipPath>
<clipPath id="clipc"><path transform="translate(-79.3,84)" d="M6.3 -131.2H56.5V0H102V-131.2H152.2V-168H6.3Z"/></clipPath>

<radialGradient id="bg" cx="50%" cy="38%" r="80%"><stop offset="0" stop-color="#10213f"/><stop offset=".55" stop-color="#0a1226"/><stop offset="1" stop-color="#070a10"/></radialGradient>
<radialGradient id="orbB"><stop offset="0" stop-color="#2f81ff" stop-opacity=".42"/><stop offset="1" stop-color="#2f81ff" stop-opacity="0"/></radialGradient>
<radialGradient id="orbC"><stop offset="0" stop-color="#38d5ff" stop-opacity=".26"/><stop offset="1" stop-color="#38d5ff" stop-opacity="0"/></radialGradient>
<radialGradient id="orbV"><stop offset="0" stop-color="#7c5cff" stop-opacity=".30"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#2f81ff" stop-opacity=".55"/><stop offset=".6" stop-color="#2f81ff" stop-opacity=".12"/><stop offset="1" stop-color="#2f81ff" stop-opacity="0"/></radialGradient>
<linearGradient id="blk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2232"/><stop offset="1" stop-color="#06080d"/></linearGradient>
<linearGradient id="blu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5aa9ff"/><stop offset="1" stop-color="#1560e0"/></linearGradient>
<linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".62"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38d5ff" stop-opacity="0"/><stop offset=".5" stop-color="#38d5ff" stop-opacity=".55"/><stop offset="1" stop-color="#38d5ff" stop-opacity="0"/></linearGradient>
<linearGradient id="corner" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f81ff" stop-opacity=".95"/><stop offset="1" stop-color="#1448b8" stop-opacity=".45"/></linearGradient>
<pattern id="gridPat" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#2f81ff" stroke-opacity=".13" stroke-width="1"/></pattern>
<radialGradient id="gm" cx="50%" cy="46%" r="62%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<mask id="gridMask"><rect width="1200" height="452" fill="url(#gm)"/></mask>

<style>
text{font-family:Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,'DejaVu Sans Mono',Menlo,monospace}
.fb{transform-box:fill-box;transform-origin:center}
.fl{transform-box:fill-box;transform-origin:left center}

.orb{animation:drift 16s ease-in-out infinite alternate}
.o2{animation-duration:19s;animation-delay:-6s}.o3{animation-duration:22s;animation-delay:-11s}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(46px,30px)}}
.grid{animation:gridmove 3.2s linear infinite}
@keyframes gridmove{from{transform:translateY(0)}to{transform:translateY(48px)}}
.pt{opacity:0;animation-name:rise;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.9}85%{opacity:.7}100%{transform:translateY(-480px);opacity:0}}
.scan{animation:scan 7s linear infinite;opacity:.5}
@keyframes scan{0%{transform:translateY(-6px);opacity:0}8%{opacity:.5}92%{opacity:.5}100%{transform:translateY(458px);opacity:0}}
.glow{animation:glowp 4.2s ease-in-out infinite alternate}
@keyframes glowp{from{opacity:.55}to{opacity:1}}
.cTL{animation:cin1 .9s cubic-bezier(.2,.9,.2,1) both}
.cBR{animation:cin2 .9s cubic-bezier(.2,.9,.2,1) .15s both}
@keyframes cin1{from{transform:translate(-150px,-150px)}}
@keyframes cin2{from{transform:translate(150px,150px)}}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw .55s ease-out both}
@keyframes draw{from{stroke-dashoffset:1}}
.pulseL,.pulseR{animation:bpulse 3.2s ease-in-out 1.6s infinite}
.pulseR{animation-delay:2.4s}
@keyframes bpulse{0%,100%{opacity:1}50%{opacity:.45}}
.burst{animation:bflash 3.2s ease-in-out 2.2s infinite}
.bl2{animation-delay:3s}
@keyframes bflash{0%,100%{opacity:1}50%{opacity:.3}}
.pop{animation:pop .8s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{opacity:0;transform:translateY(46px) scale(.55) rotate(-10deg)}}
.flt{animation:flt 4.6s ease-in-out infinite alternate}
@keyframes flt{from{transform:translateY(-3px)}to{transform:translateY(4px)}}
.shim{animation:shim 5.5s ease-in-out infinite;transform:translateX(0)}
@keyframes shim{0%{transform:translateX(-40px)}22%,100%{transform:translateX(330px)}}
.pill{animation:pill .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pill{from{opacity:0;transform:scale(.5)}}
.pillshine{animation:pshine 3.6s ease-in-out 3.6s infinite}
@keyframes pshine{0%,100%{stroke-opacity:.9}50%{stroke-opacity:.25}}
.tag{animation:tag .7s ease-out both}
@keyframes tag{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){.orb,.grid,.pt,.scan,.glow,.pulseL,.pulseR,.burst,.flt,.shim,.pillshine,.pop,.tag,.draw,.cTL,.cBR,.pill{animation:none!important}.pt{display:none}}
</style>
</defs>
