<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="236" viewBox="0 0 1200 236" role="img" aria-labelledby="t d">
<title id="t">DDT at a glance</title>
<desc id="d">Animated stat cards: 290+ user plugins, 170+ core plugins, 112+ themes, 230K+ lines of code, 0% telemetry.</desc>
<defs>

<linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111c35"/><stop offset="1" stop-color="#0a101e"/></linearGradient>
<linearGradient id="numg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#5aa9ff"/></linearGradient>
<linearGradient id="arc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f81ff"/><stop offset="1" stop-color="#38d5ff"/></linearGradient>
<linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38d5ff" stop-opacity="0"/><stop offset=".5" stop-color="#38d5ff"/><stop offset="1" stop-color="#38d5ff" stop-opacity="0"/></linearGradient>

<style>
text{font-family:Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,'DejaVu Sans Mono',Menlo,monospace}
.fb{transform-box:fill-box;transform-origin:center}
.fl{transform-box:fill-box;transform-origin:left center}

.card{animation:cin .75s cubic-bezier(.2,.9,.2,1) both}
@keyframes cin{from{opacity:0;transform:translateY(28px)}}
.edge{opacity:.15;animation:edge 3.6s ease-in-out infinite alternate}
@keyframes edge{from{opacity:.12}to{opacity:.85}}
.sweep{animation:sweep 3.4s ease-in-out infinite alternate}
@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(94px)}}
.num{animation:numin .8s cubic-bezier(.2,1.5,.4,1) both;transform-box:fill-box;transform-origin:center}
@keyframes numin{from{opacity:0;transform:scale(.6)}}
.dw{animation:dw 2.6s ease-in-out infinite}
@keyframes dw{0%,100%{opacity:.25}40%{opacity:1}}
.ring{animation:spin 2.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.core{animation:core 1.8s ease-in-out infinite}
@keyframes core{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
.sw{animation:bob 1.7s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(5px)}to{transform:translateY(-6px)}}
.dr{stroke-dasharray:1;animation:drl 4.4s ease-in-out infinite}
@keyframes drl{0%{stroke-dashoffset:1}14%,86%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
.blink{animation:bl .9s steps(2,start) infinite}
@keyframes bl{to{opacity:0}}
.dr2{stroke-dasharray:1;animation:drs 4.8s ease-in-out infinite}
@keyframes drs{0%{stroke-dashoffset:1}16%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
.dr3{stroke-dasharray:1;animation:drc 4.8s ease-in-out infinite}
@keyframes drc{0%,14%{stroke-dashoffset:1}28%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
@media (prefers-reduced-motion:reduce){.edge,.sweep,.dw,.ring,.core,.sw,.dr,.blink,.dr2,.dr3,.card,.num{animation:none!important}.edge{opacity:.3}}
</style>
</defs>
<g transform="translate(0,14)"><g class="card" style="animation-delay:0.0s"><rect width="224" height="206" rx="18" fill="url(#cardbg)" stroke="#1c2a47"/><rect class="edge" width="224" height="206" rx="18" fill="none" stroke="#2f81ff" stroke-width="1.6" style="animation-delay:0.0s"/><rect class="sweep" x="22" y="1" width="86" height="2.4" rx="1.2" fill="url(#sw)" style="animation-delay:0.0s"/><circle class="dw" cx="91.0" cy="44" r="3.6" fill="#5aa9ff" style="animation-delay:0.0s"/><circle class="dw" cx="105.0" cy="44" r="3.6" fill="#5aa9ff" style="animation-delay:0.16s"/><circle class="dw" cx="119.0" cy="44" r="3.6" fill="#5aa9ff" style="animation-delay:0.32s"/><circle class="dw" cx="133.0" cy="44" r="3.6" fill="#5aa9ff" style="animation-delay:0.48s"/><circle class="dw" cx="91.0" cy="58" r="3.6" fill="#5aa9ff" style="animation-delay:0.16s"/><circle class="dw" cx="105.0" cy="58" r="3.6" fill="#5aa9ff" style="animation-delay:0.32s"/><circle class="dw" cx="119.0" cy="58" r="3.6" fill="#5aa9ff" style="animation-delay:0.48s"/><circle class="dw" cx="133.0" cy="58" r="3.6" fill="#5aa9ff" style="animation-delay:0.64s"/><circle class="dw" cx="91.0" cy="72" r="3.6" fill="#5aa9ff" style="animation-delay:0.32s"/><circle class="dw" cx="105.0" cy="72" r="3.6" fill="#5aa9ff" style="animation-delay:0.48s"/><circle class="dw" cx="119.0" cy="72" r="3.6" fill="#5aa9ff" style="animation-delay:0.64s"/><circle class="dw" cx="133.0" cy="72" r="3.6" fill="#5aa9ff" style="animation-delay:0.8s"/><text class="num" x="112.0" y="146" text-anchor="middle" font-size="50" font-weight="800" fill="url(#numg)" style="animation-delay:0.35s">290+</text><text x="112.0" y="170" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="2.2" fill="#a9bde3">USER PLUGINS</text><text x="112.0" y="190" text-anchor="middle" font-size="12" fill="#8da2c8">Built in, ready on install</text></g></g>
<g transform="translate(244,14)"><g class="card" style="animation-delay:0.13s"><rect width="224" height="206" rx="18" fill="url(#cardbg)" stroke="#1c2a47"/><rect class="edge" width="224" height="206" rx="18" fill="none" stroke="#2f81ff" stroke-width="1.6" style="animation-delay:0.45s"/><rect class="sweep" x="22" y="1" width="86" height="2.4" rx="1.2" fill="url(#sw)" style="animation-delay:0.5s"/><circle cx="112.0" cy="58" r="20" fill="none" stroke="#1c2a47" stroke-width="5"/><circle class="ring fb" cx="112.0" cy="58" r="20" fill="none" stroke="url(#arc)" stroke-width="5" stroke-linecap="round" stroke-dasharray="34 92"/><circle class="core fb" cx="112.0" cy="58" r="5.5" fill="#38d5ff"/><text class="num" x="112.0" y="146" text-anchor="middle" font-size="50" font-weight="800" fill="url(#numg)" style="animation-delay:0.48s">170+</text><text x="112.0" y="170" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="2.2" fill="#a9bde3">CORE PLUGINS</text><text x="112.0" y="190" text-anchor="middle" font-size="12" fill="#8da2c8">Framework plugins under the hood</text></g></g>
<g transform="translate(488,14)"><g class="card" style="animation-delay:0.26s"><rect width="224" height="206" rx="18" fill="url(#cardbg)" stroke="#1c2a47"/><rect class="edge" width="224" height="206" rx="18" fill="none" stroke="#2f81ff" stroke-width="1.6" style="animation-delay:0.9s"/><rect class="sweep" x="22" y="1" width="86" height="2.4" rx="1.2" fill="url(#sw)" style="animation-delay:1.0s"/><circle class="sw" cx="70.0" cy="58" r="9.5" fill="#2f81ff" style="animation-delay:0.0s"/><circle class="sw" cx="91.0" cy="58" r="9.5" fill="#7c5cff" style="animation-delay:0.18s"/><circle class="sw" cx="112.0" cy="58" r="9.5" fill="#38d5ff" style="animation-delay:0.36s"/><circle class="sw" cx="133.0" cy="58" r="9.5" fill="#ff5ca8" style="animation-delay:0.54s"/><circle class="sw" cx="154.0" cy="58" r="9.5" fill="#ffb454" style="animation-delay:0.72s"/><text class="num" x="112.0" y="146" text-anchor="middle" font-size="50" font-weight="800" fill="url(#numg)" style="animation-delay:0.61s">112+</text><text x="112.0" y="170" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="2.2" fill="#a9bde3">THEMES</text><text x="112.0" y="190" text-anchor="middle" font-size="12" fill="#8da2c8">Curated, one-click switching</text></g></g>
<g transform="translate(732,14)"><g class="card" style="animation-delay:0.39s"><rect width="224" height="206" rx="18" fill="url(#cardbg)" stroke="#1c2a47"/><rect class="edge" width="224" height="206" rx="18" fill="none" stroke="#2f81ff" stroke-width="1.6" style="animation-delay:1.35s"/><rect class="sweep" x="22" y="1" width="86" height="2.4" rx="1.2" fill="url(#sw)" style="animation-delay:1.5s"/><g fill="none" stroke="#5aa9ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><polyline class="dr" pathLength="1" points="96.0,45 83.0,58 96.0,71"/><line class="dr" pathLength="1" style="animation-delay:.18s" x1="117.0" y1="42" x2="107.0" y2="74"/><polyline class="dr" pathLength="1" style="animation-delay:.36s" points="128.0,45 141.0,58 128.0,71"/></g><rect class="blink" x="146.0" y="64" width="9" height="4" rx="1" fill="#38d5ff"/><text class="num" x="112.0" y="146" text-anchor="middle" font-size="50" font-weight="800" fill="url(#numg)" style="animation-delay:0.74s">230K+</text><text x="112.0" y="170" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="2.2" fill="#a9bde3">LINES OF CODE</text><text x="112.0" y="190" text-anchor="middle" font-size="12" fill="#8da2c8">TypeScript / React source</text></g></g>
<g transform="translate(976,14)"><g class="card" style="animation-delay:0.52s"><rect width="224" height="206" rx="18" fill="url(#cardbg)" stroke="#1c2a47"/><rect class="edge" width="224" height="206" rx="18" fill="none" stroke="#34d399" stroke-width="1.6" style="animation-delay:1.8s"/><rect class="sweep" x="22" y="1" width="86" height="2.4" rx="1.2" fill="url(#sw)" style="animation-delay:2.0s"/><path class="dr2" pathLength="1" d="M112.0 32 L132.0 39 V57 C132.0 69 124.0 78 112.0 84 C100.0 78 92.0 69 92.0 57 V39 Z" fill="#34d399" fill-opacity=".10" stroke="#34d399" stroke-width="3.5" stroke-linejoin="round"/><polyline class="dr3" pathLength="1" points="102.0,58 109.0,66 123.0,49" fill="none" stroke="#34d399" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><text class="num" x="112.0" y="146" text-anchor="middle" font-size="50" font-weight="800" fill="url(#numg)" style="animation-delay:0.87s">0%</text><text x="112.0" y="170" text-anchor="middle" font-size="12.5" font-weight="700" letter-spacing="2.2" fill="#a9bde3">TELEMETRY</text><text x="112.0" y="190" text-anchor="middle" font-size="12" fill="#8da2c8">100% local, nothing phones home</text></g></g>
</svg>
