<rect class="pill" x=".75" y=".75" width="758.5" height="62.5" rx="31.25" fill="#0b1020" stroke="#2f81ff" stroke-opacity=".7" stroke-width="1.5"/>
<text class="mono" x="30" y="40" font-size="22" font-weight="700" fill="#5aa9ff">&gt;</text>
<g class="ph ph0"><text class="mono" x="66" y="40" font-size="20" fill="#e8eefc" textLength="516.0" lengthAdjust="spacingAndGlyphs">288+ built-in plugins, ready out of the box</text><g class="mv0"><rect x="65" y="14" width="524.0" height="36" fill="#0b1020"/><rect class="caret" x="66" y="16" width="2.5" height="32" rx="1.2" fill="#5aa9ff"/></g></g>
<g class="ph ph1"><text class="mono" x="66" y="40" font-size="20" fill="#e8eefc" textLength="324.0" lengthAdjust="spacingAndGlyphs">Zero telemetry. 100% local.</text><g class="mv1"><rect x="65" y="14" width="332.0" height="36" fill="#0b1020"/><rect class="caret" x="66" y="16" width="2.5" height="32" rx="1.2" fill="#5aa9ff"/></g></g>
<g class="ph ph2"><text class="mono" x="66" y="40" font-size="20" fill="#e8eefc" textLength="372.0" lengthAdjust="spacingAndGlyphs">110+ themes, switched instantly</text><g class="mv2"><rect x="65" y="14" width="380.0" height="36" fill="#0b1020"/><rect class="caret" x="66" y="16" width="2.5" height="32" rx="1.2" fill="#5aa9ff"/></g></g>
<g class="ph ph3"><text class="mono" x="66" y="40" font-size="20" fill="#e8eefc" textLength="396.0" lengthAdjust="spacingAndGlyphs">2-4x faster startup with DDT-Asar</text><g class="mv3"><rect x="65" y="14" width="404.0" height="36" fill="#0b1020"/><rect class="caret" x="66" y="16" width="2.5" height="32" rx="1.2" fill="#5aa9ff"/></g></g>
<circle class="dt0" cx="668" cy="32" r="3.2" fill="#5aa9ff"/><circle class="dt1" cx="684" cy="32" r="3.2" fill="#5aa9ff"/><circle class="dt2" cx="700" cy="32" r="3.2" fill="#5aa9ff"/><circle class="dt3" cx="716" cy="32" r="3.2" fill="#5aa9ff"/>
