<svg xmlns="http://www.w3.org/2000/svg" width="760" height="64" viewBox="0 0 760 64" role="img" aria-labelledby="t d">
<title id="t">DDT feature ticker</title>
<desc id="d">A typewriter banner cycling through DDT's headline features.</desc>
<defs>

<style>
text{font-family:Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,'DejaVu Sans Mono',Menlo,monospace}
.fb{transform-box:fill-box;transform-origin:center}
.fl{transform-box:fill-box;transform-origin:left center}
.pill{animation:pillglow 4s ease-in-out infinite alternate}@keyframes pillglow{from{stroke-opacity:.55}to{stroke-opacity:1}}.caret{animation:blink .55s steps(2,start) infinite}@keyframes blink{to{opacity:0}}.ph{opacity:0}.ph0{opacity:1}@keyframes v0{0%{opacity:1} 25.0%{opacity:1} 25.057%{opacity:0} 100%{opacity:0}}.ph0{animation:v0 17.6s linear infinite}@keyframes m0{0%{transform:translateX(0)}1.705%{transform:translateX(0);animation-timing-function:steps(43,end)}13.92%{transform:translateX(516.0px)}21.307%{transform:translateX(516.0px);animation-timing-function:steps(43,end)}24.92%,100%{transform:translateX(0)}}.mv0{transform:translateX(516.0px);animation:m0 17.6s infinite}@keyframes d0{0%{opacity:1}25.0%{opacity:1}25.057%{opacity:.28}100%{opacity:.28}}.dt0{opacity:1;animation:d0 17.6s linear infinite}@keyframes v1{0%{opacity:0} 24.943%{opacity:0} 25.0%{opacity:1} 50.0%{opacity:1} 50.057%{opacity:0} 100%{opacity:0}}.ph1{animation:v1 17.6s linear infinite}@keyframes m1{0%{transform:translateX(0)}26.705%{transform:translateX(0);animation-timing-function:steps(27,end)}34.375%{transform:translateX(324.0px)}46.307%{transform:translateX(324.0px);animation-timing-function:steps(27,end)}48.83%,100%{transform:translateX(0)}}.mv1{transform:translateX(324.0px);animation:m1 17.6s infinite}@keyframes d1{0%{opacity:.28}25.0%{opacity:.28}25.057%{opacity:1}50.0%{opacity:1}50.057%{opacity:.28}100%{opacity:.28}}.dt1{opacity:0.28;animation:d1 17.6s linear infinite}@keyframes v2{0%{opacity:0} 49.943%{opacity:0} 50.0%{opacity:1} 75.0%{opacity:1} 75.057%{opacity:0} 100%{opacity:0}}.ph2{animation:v2 17.6s linear infinite}@keyframes m2{0%{transform:translateX(0)}51.705%{transform:translateX(0);animation-timing-function:steps(31,end)}60.511%{transform:translateX(372.0px)}71.307%{transform:translateX(372.0px);animation-timing-function:steps(31,end)}74.102%,100%{transform:translateX(0)}}.mv2{transform:translateX(372.0px);animation:m2 17.6s infinite}@keyframes d2{0%{opacity:.28}50.0%{opacity:.28}50.057%{opacity:1}75.0%{opacity:1}75.057%{opacity:.28}100%{opacity:.28}}.dt2{opacity:0.28;animation:d2 17.6s linear infinite}@keyframes v3{0%{opacity:0} 74.943%{opacity:0} 75.0%{opacity:1} 100%{opacity:1}}.ph3{animation:v3 17.6s linear infinite}@keyframes m3{0%{transform:translateX(0)}76.705%{transform:translateX(0);animation-timing-function:steps(33,end)}86.08%{transform:translateX(396.0px)}96.307%{transform:translateX(396.0px);animation-timing-function:steps(33,end)}99.239%,100%{transform:translateX(0)}}.mv3{transform:translateX(396.0px);animation:m3 17.6s infinite}@keyframes d3{0%{opacity:.28}75.0%{opacity:.28}75.057%{opacity:1}100%{opacity:1}}.dt3{opacity:0.28;animation:d3 17.6s linear infinite}@media (prefers-reduced-motion:reduce){.pill,.caret,.ph,.mv0,.mv1,.mv2,.mv3,.dt0,.dt1,.dt2,.dt3{animation:none!important}}</style>
