<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="t d">
<title id="t">DDT Audio &amp; Media Visualizer Engine</title>
<desc id="d">Minimalist luxury HUD showcasing DDT audio visualizer, waveform analyzer, and 3D spatial sound processing.</desc>
<defs>
<linearGradient id="abg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#091120"/><stop offset="100%" stop-color="#050912"/></linearGradient>
<linearGradient id="waveG" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#2f81ff"/>
  <stop offset="35%" stop-color="#38d5ff"/>
  <stop offset="70%" stop-color="#818cf8"/>
  <stop offset="100%" stop-color="#ec4899"/>
</linearGradient>
<linearGradient id="barG" x1="0" y1="1" x2="0" y2="0">
  <stop offset="0%" stop-color="#1e3a8a"/>
  <stop offset="60%" stop-color="#3b82f6"/>
  <stop offset="100%" stop-color="#60a5fa"/>
</linearGradient>

<style>
text{font-family:Inter,'Segoe UI',system-ui,-apple-system,sans-serif}
.mono{font-family:'JetBrains Mono','Fira Code',Consolas,monospace}
.vbar{animation:jump 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom}
@keyframes jump{0%{transform:scaleY(0.25)}50%{transform:scaleY(1)}100%{transform:scaleY(0.4)}}
</style>
</defs>

<rect width="1200" height="210" rx="16" fill="url(#abg)" stroke="#1a2744" stroke-width="1.2"/>

<!-- Left Details -->
<g transform="translate(48, 40)">
  <rect x="0" y="0" width="34" height="34" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
  <path d="M12 24 V14 M17 26 V10 M22 24 V16" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round"/>
  
  <text x="48" y="16" font-size="11" font-weight="700" letter-spacing="3" fill="#818cf8" class="mono">ACOUSTIC SUITE</text>
  <text x="48" y="34" font-size="18" font-weight="700" fill="#ffffff">Hi-Fi Waveform HUD &amp; 3D Audio</text>
  
  <text x="0" y="80" font-size="11.5" fill="#8da2c8">Real-time stereo spectrum analyzer, lossless microphone capture, custom hotkey soundboard, and synchronized lyrics status engine.</text>
  <text x="0" y="112" font-size="10.5" fill="#38d5ff" class="mono">OUTPUT: 32-BIT FLOAT // 48kHz STEREO PASSTHROUGH</text>
</g>

<!-- Right Side Waveform Visualizer Bars -->
<g transform="translate(560, 50)">
  <!-- Backdrop glass card -->
  <rect x="0" y="0" width="590" height="110" rx="10" fill="#0c1527" stroke="#1c2c4c" stroke-width="1.2"/>
  
  <!-- Frequency Spectrum Bars (Animated) -->
  <g transform="translate(30, 90)">
    <!-- 32 spectrum bars with stepped delays -->
    <rect class="vbar" x="0" y="-55" width="8" height="55" rx="3" fill="url(#barG)" style="animation-delay:0.1s"/>
    <rect class="vbar" x="16" y="-70" width="8" height="70" rx="3" fill="url(#barG)" style="animation-delay:0.35s"/>
    <rect class="vbar" x="32" y="-45" width="8" height="45" rx="3" fill="url(#barG)" style="animation-delay:0.05s"/>
    <rect class="vbar" x="48" y="-60" width="8" height="60" rx="3" fill="url(#barG)" style="animation-delay:0.5s"/>
    <rect class="vbar" x="64" y="-80" width="8" height="80" rx="3" fill="url(#barG)" style="animation-delay:0.2s"/>
    <rect class="vbar" x="80" y="-75" width="8" height="75" rx="3" fill="url(#barG)" style="animation-delay:0.6s"/>
    <rect class="vbar" x="96" y="-50" width="8" height="50" rx="3" fill="url(#barG)" style="animation-delay:0.15s"/>
    <rect class="vbar" x="112" y="-65" width="8" height="65" rx="3" fill="url(#barG)" style="animation-delay:0.4s"/>
    <rect class="vbar" x="128" y="-85" width="8" height="85" rx="3" fill="url(#barG)" style="animation-delay:0.25s"/>
    <rect class="vbar" x="144" y="-55" width="8" height="55" rx="3" fill="url(#barG)" style="animation-delay:0.7s"/>
    <rect class="vbar" x="160" y="-70" width="8" height="70" rx="3" fill="url(#barG)" style="animation-delay:0.3s"/>
    <rect class="vbar" x="176" y="-80" width="8" height="80" rx="3" fill="url(#barG)" style="animation-delay:0.55s"/>
    <rect class="vbar" x="192" y="-60" width="8" height="60" rx="3" fill="url(#barG)" style="animation-delay:0.1s"/>
    <rect class="vbar" x="208" y="-75" width="8" height="75" rx="3" fill="url(#barG)" style="animation-delay:0.45s"/>
    <rect class="vbar" x="224" y="-50" width="8" height="50" rx="3" fill="url(#barG)" style="animation-delay:0.65s"/>
    <rect class="vbar" x="240" y="-85" width="8" height="85" rx="3" fill="url(#barG)" style="animation-delay:0.2s"/>
    <rect class="vbar" x="256" y="-65" width="8" height="65" rx="3" fill="url(#barG)" style="animation-delay:0.35s"/>
    <rect class="vbar" x="272" y="-55" width="8" height="55" rx="3" fill="url(#barG)" style="animation-delay:0.5s"/>
    <rect class="vbar" x="288" y="-75" width="8" height="75" rx="3" fill="url(#barG)" style="animation-delay:0.15s"/>
    <rect class="vbar" x="304" y="-80" width="8" height="80" rx="3" fill="url(#barG)" style="animation-delay:0.6s"/>
    <rect class="vbar" x="320" y="-60" width="8" height="60" rx="3" fill="url(#barG)" style="animation-delay:0.3s"/>
    <rect class="vbar" x="336" y="-70" width="8" height="70" rx="3" fill="url(#barG)" style="animation-delay:0.45s"/>
    <rect class="vbar" x="352" y="-85" width="8" height="85" rx="3" fill="url(#barG)" style="animation-delay:0.25s"/>
    <rect class="vbar" x="368" y="-50" width="8" height="50" rx="3" fill="url(#barG)" style="animation-delay:0.7s"/>
    <rect class="vbar" x="384" y="-65" width="8" height="65" rx="3" fill="url(#barG)" style="animation-delay:0.1s"/>
    <rect class="vbar" x="400" y="-75" width="8" height="75" rx="3" fill="url(#barG)" style="animation-delay:0.55s"/>
    <rect class="vbar" x="416" y="-55" width="8" height="55" rx="3" fill="url(#barG)" style="animation-delay:0.2s"/>
    <rect class="vbar" x="432" y="-70" width="8" height="70" rx="3" fill="url(#barG)" style="animation-delay:0.4s"/>
    <rect class="vbar" x="448" y="-80" width="8" height="80" rx="3" fill="url(#barG)" style="animation-delay:0.65s"/>
    <rect class="vbar" x="464" y="-60" width="8" height="60" rx="3" fill="url(#barG)" style="animation-delay:0.3s"/>
    <rect class="vbar" x="480" y="-50" width="8" height="50" rx="3" fill="url(#barG)" style="animation-delay:0.15s"/>
    <rect class="vbar" x="496" y="-40" width="8" height="40" rx="3" fill="url(#barG)" style="animation-delay:0.5s"/>
    <rect class="vbar" x="512" y="-30" width="8" height="30" rx="3" fill="url(#barG)" style="animation-delay:0.25s"/>
  </g>
</g>

</svg>
