<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="516" viewBox="0 0 1000 516" role="img" aria-labelledby="t d">
<title id="t">DDT installer in action</title>
<desc id="d">Animated terminal showing python install.py building DDT, injecting it into Discord and optionally installing DDT-Asar.</desc>
<defs>

<style>
text{font-family:Inter,'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
.mono{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,'DejaVu Sans Mono',Menlo,monospace}
.fb{transform-box:fill-box;transform-origin:center}
.fl{transform-box:fill-box;transform-origin:left center}
.win{animation:winglow 4s ease-in-out infinite alternate}@keyframes winglow{from{stroke-opacity:.35}to{stroke-opacity:1}}.blink{animation:bl .8s steps(2,start) infinite}@keyframes bl{to{opacity:0}}.scan{animation:sc 5s linear infinite}@keyframes sc{from{transform:translateY(46px)}to{transform:translateY(508px)}}@keyframes cm{0%,3.889%{transform:translateX(0);animation-timing-function:steps(17,end)}13.333%{transform:translateX(153.0px)}15.556%,100%{transform:translateX(153.0px)}}.cm{transform:translateX(153.0px);animation:cm 18.0s infinite}@keyframes cmv{0%,15.833%{opacity:1}15.889%,100%{opacity:0}}.cmv{opacity:0;animation:cmv 18.0s linear infinite}@keyframes l0{0%,16.111%{opacity:0;transform:translateX(-10px)}17.111%{opacity:1;transform:translateX(0)}88.889%{opacity:1}94.444%,100%{opacity:0}}.l0{animation:l0 18.0s linear infinite}@keyframes l1{0%,19.444%{opacity:0;transform:translateX(-10px)}20.444%{opacity:1;transform:translateX(0)}88.889%{opacity:1}94.444%,100%{opacity:0}}.l1{animation:l1 18.0s linear infinite}@keyframes l2{0%,22.778%{opacity:0;transform:translateX(-10px)}23.778%{opacity:1;transform:translateX(0)}88.889%{opacity:1}94.444%,100%{opacity:0}}.l2{animation:l2 18.0s linear infinite}@keyframes l3{0%,26.667%{opacity:0;transform:translateX(-10px)}27.667%{opacity:1;transform:translateX(0)}88.889%{opacity:1}94.444%,100%{opacity:0}}.l3{animation:l3 18.0s linear infinite}@keyframes l4{0%,35.0%{opacity:0;transform:translateX(-10px)}36.0%{opacity:1;transform:translateX(0)}88.889%{opacity:1}94.444%,100%{opacity:0}}.l4{animation:l4 18.0s linear infinite}@keyframes l5{0%,38.333%{opacity:0;transform:translateX(-10px)}39.333%{opacity:1;transform:translateX(0)}88.889%{opacity:1}94.444%,100%{opacity:0}}.l5{animation:l5 18.0s linear infinite}@keyframes l6{0%,42.222%{opacity:0;transform:translateX(-10px)}43.222%{opacity:1;transform:translateX(0)}88.889%{opacity:1}94.444%,100%{opacity:0}}.l6{animation:l6 18.0s linear infinite}@keyframes l7{0%,51.667%{opacity:0;transform:translateX(-10px)}52.667%{opacity:1;transform:translateX(0)}88.889%{opacity:1}94.444%,100%{opacity:0}}.l7{animation:l7 18.0s linear infinite}@keyframes l8{0%,57.778%{opacity:0;transform:translateX(-10px)}58.778%{opacity:1;transform:translateX(0)}88.889%{opacity:1}94.444%,100%{opacity:0}}.l8{animation:l8 18.0s linear infinite}@keyframes l9{0%,61.667%{opacity:0;transform:translateX(-10px)}62.667%{opacity:1;transform:translateX(0)}88.889%{opacity:1}94.444%,100%{opacity:0}}.l9{animation:l9 18.0s linear infinite}@keyframes l10{0%,63.333%{opacity:0;transform:translateX(-10px)}64.333%{opacity:1;transform:translateX(0)}88.889%{opacity:1}94.444%,100%{opacity:0}}.l10{animation:l10 18.0s linear infinite}@keyframes l11{0%,65.0%{opacity:0;transform:translateX(-10px)}66.0%{opacity:1;transform:translateX(0)}88.889%{opacity:1}94.444%,100%{opacity:0}}.l11{animation:l11 18.0s linear infinite}@keyframes ya{0%,47.222%{opacity:0}47.5%{opacity:1}88.889%{opacity:1}94.444%,100%{opacity:0}}.ya{animation:ya 18.0s linear infinite}@keyframes fc{0%,66.667%{opacity:0}66.944%{opacity:1}88.889%{opacity:1}94.444%,100%{opacity:0}}.fc{animation:fc 18.0s linear infinite}@media (prefers-reduced-motion:reduce){.win,.blink,.scan,.cm,.cmv,.ya,.fc,.l0,.l1,.l2,.l3,.l4,.l5,.l6,.l7,.l8,.l9,.l10,.l11{animation:none!important}.cm{transform:translateX(9999px)}.cmv,.fc{opacity:0}.scan{display:none}}</style>
</defs>
<rect class="win" x=".75" y=".75" width="998.5" height="514.5" rx="16" fill="#0a0e17" stroke="#2f81ff" stroke-opacity=".6" stroke-width="1.5"/>
<path d="M.75 46 V17 A16 16 0 0 1 16.75 .75 H983.25 A16 16 0 0 1 999.25 17 V46 Z" fill="#0f1730"/>
<line x1="1" y1="46" x2="999" y2="46" stroke="#1c2a47"/>
<circle cx="28" cy="23" r="6.5" fill="#ff5f57"/><circle cx="50" cy="23" r="6.5" fill="#febc2e"/><circle cx="72" cy="23" r="6.5" fill="#28c840"/>
<text class="mono" x="500.0" y="28" text-anchor="middle" font-size="13" fill="#8da2c8">PowerShell  -  DDT-Custom-Client</text>
<text class="mono" x="30" y="98" font-size="15" textLength="315.0" lengthAdjust="spacingAndGlyphs" fill="#6ea8ff" xml:space="preserve">PS C:\Users\you\DDT-Custom-Client> </text><text class="mono" x="345.0" y="98" font-size="15" textLength="153.0" lengthAdjust="spacingAndGlyphs" fill="#ffffff" font-weight="600">python install.py</text>
<g class="cmv"><g class="cm"><rect x="344.0" y="82" width="183.0" height="22" fill="#0a0e17"/><rect class="blink" x="345.0" y="83" width="8" height="19" fill="#5aa9ff"/></g></g>
<text class="mono l0" x="30" y="126" font-size="15" textLength="315.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#34d399">[OK] </tspan><tspan fill="#c7d4ee">Node.js v22.23.1 detected (OK)</tspan></text>
<text class="mono l1" x="30" y="154" font-size="15" textLength="288.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#34d399">[OK] </tspan><tspan fill="#c7d4ee">pnpm found (version 11.9.0)</tspan></text>
<text class="mono l2" x="30" y="182" font-size="15" textLength="243.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#34d399">[OK] </tspan><tspan fill="#c7d4ee">Dependencies installed</tspan></text>
<text class="mono l3" x="30" y="210" font-size="15" textLength="504.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#4f9dff">[INFO] </tspan><tspan fill="#c7d4ee">Building DDT Client (this may take 30-60 seconds)</tspan></text>
<text class="mono l4" x="30" y="238" font-size="15" textLength="180.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#34d399">[OK] </tspan><tspan fill="#c7d4ee">Build completed</tspan></text>
<text class="mono l5" x="30" y="266" font-size="15" textLength="216.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#34d399">[OK] </tspan><tspan fill="#c7d4ee">Injection completed</tspan></text>
<text class="mono l6" x="30" y="294" font-size="15" textLength="225.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#fbbf24">Install DDT-Asar? (y/n): </tspan></text>
<text class="mono l7" x="30" y="322" font-size="15" textLength="306.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#34d399">[OK] </tspan><tspan fill="#c7d4ee">DDT-Asar installed! (46.4 KB)</tspan></text>
<text class="mono l8" x="30" y="378" font-size="15" textLength="396.0" lengthAdjust="spacingAndGlyphs" font-weight="700" xml:space="preserve"><tspan fill="#34d399">[SUCCESS] </tspan><tspan fill="#c7d4ee">DDT Custom Client is now installed</tspan></text>
<text class="mono l9" x="30" y="406" font-size="15" textLength="99.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#8da2c8">NEXT STEPS:</tspan></text>
<text class="mono l10" x="30" y="434" font-size="15" textLength="423.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#c7d4ee">1. Close Discord completely (check system tray)</tspan></text>
<text class="mono l11" x="30" y="462" font-size="15" textLength="162.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan fill="#c7d4ee">2. Restart Discord</tspan></text>
<text class="mono ya" x="255.0" y="294" font-size="15" fill="#fff" font-weight="600">y</text>
<g class="fc"><text class="mono" x="30" y="490" font-size="15" textLength="315.0" lengthAdjust="spacingAndGlyphs" fill="#6ea8ff" xml:space="preserve">PS C:\Users\you\DDT-Custom-Client> </text><rect class="blink" x="345.0" y="475" width="8" height="19" fill="#5aa9ff"/></g>
<rect class="scan" x="2" y="0" width="996" height="3" fill="#5aa9ff" opacity=".07"/>
